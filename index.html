<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1A73E8">
    <title>Finanzas App</title>
    <style>
        :root {
            --bg: #F5F8FC;
            --card-bg: #FFFFFF;
            --primary: #1A73E8;
            --primary-dark: #1557B0;
            --secondary: #4A90D9;
            --accent: #2196F3;
            --success: #0D904F;
            --danger: #D93025;
            --warning: #E37400;
            --text: #1A2332;
            --text-light: #5F6B7A;
            --border: #D2E0F0;
            --shadow: 0 4px 12px rgba(26, 115, 232, 0.12);
            --shadow-lg: 0 8px 24px rgba(26, 115, 232, 0.18);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* HEADER */
        .app-header {
            background: linear-gradient(135deg, #1A73E8, #0D47A1);
            color: white;
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(26, 115, 232, 0.3);
        }
        .app-header h1 {
            font-size: 1.3em;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* NAV TABS */
        .nav-tabs {
            display: flex;
            background: white;
            margin: 10px 14px;
            border-radius: 12px;
            padding: 4px;
            box-shadow: var(--shadow);
            gap: 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: sticky;
            top: 56px;
            z-index: 99;
        }
        .nav-tab {
            flex: 1;
            min-width: fit-content;
            padding: 10px 12px;
            border: none;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.78em;
            font-weight: 600;
            color: var(--text-light);
            transition: var(--transition);
            white-space: nowrap;
        }
        .nav-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.3);
        }

        /* TAB CONTENT */
        .tab-content {
            display: none;
            padding: 0 14px;
            animation: fadeSlideIn 0.35s ease;
        }
        .tab-content.active { display: block; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CARDS */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-lg); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E8F0FE;
        }
        .card-title {
            font-size: 1.05em;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
        }
        .card-title:hover {
            color: var(--primary-dark);
        }
        .card-title .edit-icon {
            font-size: 0.7em;
            opacity: 0.6;
            transition: var(--transition);
        }
        .card-title:hover .edit-icon {
            opacity: 1;
        }

        /* BADGES */
        .badge {
            font-size: 0.68em;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .badge:hover { transform: scale(1.05); }
        .badge-primary { background: #E8F0FE; color: var(--primary); }
        .badge-success { background: #E6F4EA; color: #0D904F; }
        .badge-danger { background: #FCE8E6; color: #C5221F; }
        .badge-warning { background: #FEF7E0; color: #E37400; }
        .badge-info { background: #E8F5FE; color: #1A73E8; }

        /* BUTTONS */
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78em;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover { background: #E8F0FE; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #C5221F; }
        .btn-success { background: var(--success); color: white; }
        .btn-sm { padding: 4px 8px; font-size: 0.7em; border-radius: 8px; }
        .btn-xs { padding: 3px 6px; font-size: 0.65em; border-radius: 6px; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }

        /* TABLES */
        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.73em;
            min-width: 650px;
        }
        th {
            background: #E8F0FE;
            padding: 10px 6px;
            text-align: left;
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 0.8em;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        tr:hover td { background: #F8FAFE; }
        .row-ingreso { background: #E6F4EA; }
        .row-gasto { background: #FFF8F6; }
        .row-total {
            font-weight: 700;
            background: #E8F0FE;
            border-top: 2px solid var(--primary);
        }
        .row-sobra {
            font-weight: 700;
            background: #E6F4EA;
            color: #0D904F;
        }
        .row-deficit {
            font-weight: 700;
            background: #FCE8E6;
            color: #C5221F;
        }

        /* FIC */
        .fic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .fic-item {
            background: linear-gradient(135deg, #F8FAFE, #E8F0FE);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            border: 2px solid #D2E0F0;
            transition: var(--transition);
        }
        .fic-item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }
        .fic-item .label {
            font-size: 0.68em;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .fic-item .amount {
            font-size: 1.2em;
            font-weight: 700;
        }
        .amount.positive { color: #0D904F; }
        .amount.negative { color: #D93025; }

        /* DEUDAS */
        .deuda-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            transition: var(--transition);
        }
        .deuda-item:hover { box-shadow: var(--shadow); }
        .deuda-item.pagado { border-left-color: var(--success); opacity: 0.85; }
        .deuda-item.debe { border-left-color: var(--danger); }
        .deuda-info { flex: 1; min-width: 130px; }
        .deuda-nombre { font-weight: 600; font-size: 0.85em; color: var(--text); }
        .deuda-monto { font-weight: 700; color: var(--primary); font-size: 0.95em; }

        /* SUMMARY */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        .summary-item {
            background: #F8FAFE;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #E8F0FE;
        }
        .summary-item h4 {
            font-size: 0.65em;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .summary-item .val {
            font-size: 1.1em;
            font-weight: 700;
        }
        .val.positive { color: #0D904F; }
        .val.negative { color: #D93025; }
        .val.neutral { color: var(--primary); }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal h3 {
            margin-bottom: 16px;
            color: var(--primary);
            font-size: 1.1em;
            padding-bottom: 10px;
            border-bottom: 2px solid #E8F0FE;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.78em;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-light);
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.9em;
            background: #F8FAFE;
            font-family: inherit;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 1.8em;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(26, 115, 232, 0.4);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .fab:hover { background: var(--primary-dark); transform: scale(1.05); }
        .fab:active { transform: scale(0.9); }
        .fab.hidden { display: none; }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state .icon { font-size: 3em; margin-bottom: 10px; }

        /* DIVIDERS */
        .section-divider {
            border: none;
            border-top: 2px dashed var(--border);
            margin: 16px 0;
        }

        /* RESPONSIVE */
        @media (max-width: 400px) {
            .nav-tab { font-size: 0.68em; padding: 8px 6px; }
            .summary-grid, .fic-grid { grid-template-columns: 1fr 1fr; }
            .card { padding: 12px; }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { height: 4px; width: 4px; }
        ::-webkit-scrollbar-track { background: #F0F4F8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #C0D0E0; border-radius: 4px; }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>💰 Finanzas Personales</h1>
    </header>

    <nav class="nav-tabs" id="nav-tabs">
        <button class="nav-tab active" data-tab="gastos">📊 Gastos</button>
        <button class="nav-tab" data-tab="fic">🏦 FIC</button>
        <button class="nav-tab" data-tab="tarjeta">💳 Tarjeta</button>
        <button class="nav-tab" data-tab="deudas">👥 Deudas</button>
    </nav>

    <div class="tab-content active" id="tab-gastos"><div id="gastos-container"></div></div>
    <div class="tab-content" id="tab-fic"><div id="fic-container"></div></div>
    <div class="tab-content" id="tab-tarjeta"><div id="tarjeta-container"></div></div>
    <div class="tab-content" id="tab-deudas"><div id="deudas-container"></div></div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <button class="fab" id="fab" title="Agregar">+</button>

    <script>
        // ==================== DATABASE ====================
        const DB_NAME = 'FinanzasDB_v3';
        const DB_VERSION = 1;
        let db;
        let currentTab = 'gastos';
        let editId = null;
        let currentModalType = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('gastos')) db.createObjectStore('gastos', { keyPath: 'id', autoIncrement: true });
                    if (!db.objectStoreNames.contains('fic')) db.createObjectStore('fic', { keyPath: 'id', autoIncrement: true });
                    if (!db.objectStoreNames.contains('tarjeta_gastos')) db.createObjectStore('tarjeta_gastos', { keyPath: 'id', autoIncrement: true });
                    if (!db.objectStoreNames.contains('tarjeta_deudas')) db.createObjectStore('tarjeta_deudas', { keyPath: 'id', autoIncrement: true });
                    if (!db.objectStoreNames.contains('deudas')) db.createObjectStore('deudas', { keyPath: 'id', autoIncrement: true });
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function dbOp(store, mode) { return db.transaction(store, mode).objectStore(store); }

        async function dbAdd(store, data) {
            return new Promise((resolve, reject) => {
                const req = dbOp(store, 'readwrite').add(data);
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }
        async function dbPut(store, data) {
            return new Promise((resolve, reject) => {
                const req = dbOp(store, 'readwrite').put(data);
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e.target.error);
            });
        }
        async function dbGetAll(store) {
            return new Promise((resolve, reject) => {
                const req = dbOp(store, 'readonly').getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }
        async function dbDelete(store, id) {
            return new Promise((resolve, reject) => {
                const req = dbOp(store, 'readwrite').delete(id);
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e.target.error);
            });
        }

        // ==================== FORMAT ====================
        function fmt(n) { return '$ ' + Number(n).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
        function fmtDate(d) {
            if (!d) return '';
            const dt = new Date(d + 'T00:00:00');
            return dt.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // ==================== INIT ====================
        async function init() {
            await openDB();
            await cargarDatosIniciales();
            await renderAll();
            setupNav();
            setupFAB();
        }

        async function cargarDatosIniciales() {
            const gastos = await dbGetAll('gastos');
            if (gastos.length === 0) {
                const data = [
                    { mes: 'Mayo', quincena: 1, fecha: '2026-05-15', tipo: 'Ingreso', categoria: 'Salario', monto: 1116000, metodo: 'Transferencia', obs: 'Salario Quincenal' },
                    { mes: 'Mayo', quincena: 1, fecha: '2026-05-15', tipo: 'Gasto', categoria: 'Celular', monto: 500000, metodo: 'Transferencia', obs: '4/5' },
                    { mes: 'Mayo', quincena: 1, fecha: '2026-05-15', tipo: 'Gasto', categoria: 'Gasolina', monto: 30000, metodo: 'Efectivo', obs: 'Bolsillo Tarjeta' },
                    { mes: 'Mayo', quincena: 1, fecha: '2026-05-15', tipo: 'Gasto', categoria: 'Gas', monto: 96640, metodo: 'Efectivo', obs: 'Pagar recibo' },
                    { mes: 'Mayo', quincena: 1, fecha: '2026-05-15', tipo: 'Gasto', categoria: 'Agua', monto: 75810, metodo: 'Efectivo', obs: 'Pagar recibo' },
                    { mes: 'Mayo', quincena: 1, fecha: '2026-05-15', tipo: 'Gasto', categoria: 'Plan celular fin de mes', monto: 15000, metodo: 'Efectivo', obs: 'Bolsillo Tarjeta' },
                    { mes: 'Mayo', quincena: 1, fecha: '2026-05-15', tipo: 'Gasto', categoria: 'Moto Mantenimiento', monto: 50000, metodo: 'Efectivo', obs: 'UALA' },
                    { mes: 'Mayo', quincena: 1, fecha: '2026-05-15', tipo: 'Gasto', categoria: 'Internet', monto: 22500, metodo: 'Efectivo', obs: 'Ahorro Final de mes' },
                    { mes: 'Mayo', quincena: 2, fecha: '2026-05-30', tipo: 'Ingreso', categoria: 'Salario', monto: 1116000, metodo: 'Transferencia', obs: 'Salario Quincenal' },
                    { mes: 'Mayo', quincena: 2, fecha: '2026-05-30', tipo: 'Gasto', categoria: 'Cuota Moto', monto: 537000, metodo: 'Transferencia', obs: '2/16' },
                    { mes: 'Mayo', quincena: 2, fecha: '2026-05-30', tipo: 'Gasto', categoria: 'Gasolina', monto: 30000, metodo: 'Efectivo', obs: 'Bolsillo Tarjeta' },
                    { mes: 'Mayo', quincena: 2, fecha: '2026-05-30', tipo: 'Gasto', categoria: 'Soat', monto: 30000, metodo: 'Efectivo', obs: 'Ahorro para Soat' },
                    { mes: 'Mayo', quincena: 2, fecha: '2026-05-30', tipo: 'Gasto', categoria: 'Cadena Mami', monto: 40000, metodo: 'Efectivo', obs: 'Pagar cadena' },
                    { mes: 'Mayo', quincena: 2, fecha: '2026-05-30', tipo: 'Gasto', categoria: 'Plan celular fin de mes', monto: 15000, metodo: 'Efectivo', obs: 'Bolsillo Tarjeta' },
                    { mes: 'Mayo', quincena: 2, fecha: '2026-05-30', tipo: 'Gasto', categoria: 'Moto Mantenimiento', monto: 25000, metodo: 'Efectivo', obs: 'Ahorro - FIC' },
                    { mes: 'Mayo', quincena: 2, fecha: '2026-05-30', tipo: 'Gasto', categoria: 'Internet', monto: 22500, metodo: 'Efectivo', obs: 'Ahorro' },
                ];
                for (const d of data) await dbAdd('gastos', d);
            }

            const fic = await dbGetAll('fic');
            if (fic.length === 0) {
                await dbAdd('fic', { concepto: 'FIC Nu 2', monto: 1806014 });
                await dbAdd('fic', { concepto: 'Papá', monto: 5000000 });
                await dbAdd('fic', { concepto: 'Mamá', monto: 87500 });
                await dbAdd('fic', { concepto: 'Abuela', monto: 500000 });
                await dbAdd('fic', { concepto: 'Universidad', monto: 280000 });
                await dbAdd('fic', { concepto: 'Moto', monto: 50000 });
            }

            const tarjetaGastos = await dbGetAll('tarjeta_gastos');
            if (tarjetaGastos.length === 0) {
                await dbAdd('tarjeta_gastos', { corte: 'Enero 2026', tipo: 'Gasto', concepto: 'Total Gastado', monto: 2930913 });
                await dbAdd('tarjeta_gastos', { corte: 'Enero 2026', tipo: 'Ahorro', concepto: 'Monto Ahorrado', monto: 1806014 });
            }

            const tarjetaDeudas = await dbGetAll('tarjeta_deudas');
            if (tarjetaDeudas.length === 0) {
                const td = [
                    { corte: 'Enero 2026', persona: 'Daniela 4/5', monto: 441000, estado: 'Debe' },
                    { corte: 'Enero 2026', persona: 'Tia Estefania 2/3', monto: 113300, estado: 'Debe' },
                    { corte: 'Enero 2026', persona: 'Luis Amazon', monto: 184000, estado: 'Pago' },
                    { corte: 'Enero 2026', persona: 'Luis Amazon', monto: 165000, estado: 'Pago' },
                    { corte: 'Enero 2026', persona: 'Tia Yolanda', monto: 433100, estado: 'Debe' },
                    { corte: 'Enero 2026', persona: 'Chamel', monto: 122300, estado: 'Pago' },
                    { corte: 'Enero 2026', persona: 'Hermana 1/2', monto: 162500, estado: 'Pago' },
                    { corte: 'Enero 2026', persona: 'Jhonatan', monto: 17500, estado: 'Debe' },
                    { corte: 'Enero 2026', persona: 'Esteban', monto: 30000, estado: 'Pago' },
                    { corte: 'Enero 2026', persona: 'Papá 1/2', monto: 120000, estado: 'Debe' },
                ];
                for (const d of td) await dbAdd('tarjeta_deudas', d);
            }

            const deudas = await dbGetAll('deudas');
            if (deudas.length === 0) {
                const dg = [
                    { persona: 'Daniela 3/5', monto: 471000, estado: 'Pago' },
                    { persona: 'Tia Estefania 1/3', monto: 113300, estado: 'Pago' },
                    { persona: 'Daniela Uni', monto: 286000, estado: 'Pago' },
                ];
                for (const d of dg) await dbAdd('deudas', d);
            }
        }

        // ==================== NAVIGATION ====================
        function setupNav() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentTab = tab.dataset.tab;
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

        // ==================== EDITAR MES/QUINCENA ====================
        async function editarMesQuincena(mes, quincena, tipo) {
            const store = tipo === 'tarjeta' ? 'tarjeta_gastos' : 'gastos';
            const nuevoMes = prompt('Editar nombre del mes:', mes);
            if (!nuevoMes || nuevoMes === mes) return;
            const nuevaQ = prompt('Editar quincena (1 o 2):', quincena);
            if (!nuevaQ || (nuevaQ !== '1' && nuevaQ !== '2')) return;

            const items = await dbGetAll(store);
            const campoMes = tipo === 'tarjeta' ? 'corte' : 'mes';
            
            for (const item of items) {
                if (item[campoMes] === mes && (item.quincena === quincena || item.quincena === parseInt(quincena))) {
                    item[campoMes] = nuevoMes;
                    item.quincena = parseInt(nuevaQ);
                    await dbPut(store, item);
                }
            }
            
            // También actualizar deudas de tarjeta si aplica
            if (tipo === 'tarjeta') {
                const deudas = await dbGetAll('tarjeta_deudas');
                for (const d of deudas) {
                    if (d.corte === mes) {
                        d.corte = nuevoMes;
                        await dbPut('tarjeta_deudas', d);
                    }
                }
            }
            
            await renderAll();
        }

        // ==================== GASTOS ====================
        async function renderGastos() {
            const container = document.getElementById('gastos-container');
            const gastos = await dbGetAll('gastos');
            
            // Agrupar por mes y quincena
            const agrupado = {};
            for (const g of gastos) {
                const key = `${g.mes}__${g.quincena || 1}`;
                if (!agrupado[key]) agrupado[key] = { mes: g.mes, quincena: g.quincena || 1, items: [] };
                agrupado[key].items.push(g);
            }

            // Ordenar: más reciente primero (por ID descendente como proxy de fecha de creación)
            const ordenado = Object.values(agrupado).sort((a, b) => {
                const maxIdA = Math.max(...a.items.map(i => i.id || 0));
                const maxIdB = Math.max(...b.items.map(i => i.id || 0));
                return maxIdB - maxIdA; // DESCENDENTE: nuevo arriba
            });

            let html = '';
            if (ordenado.length === 0) {
                html = '<div class="empty-state"><div class="icon">📭</div><p>No hay gastos registrados</p><button class="btn btn-primary" onclick="agregarGastoModal()">➕ Agregar primer gasto</button></div>';
            }

            for (const grupo of ordenado) {
                const { mes, quincena, items } = grupo;
                const ingresos = items.filter(i => i.tipo === 'Ingreso').reduce((s,i) => s + i.monto, 0);
                const gastosT = items.filter(i => i.tipo === 'Gasto').reduce((s,i) => s + i.monto, 0);
                const sobra = ingresos - gastosT;

                html += `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title" onclick="editarMesQuincena('${mes}', ${quincena}, 'gastos')" title="Click para editar">
                            📅 ${mes} 
                            <span class="badge badge-primary">Quincena ${quincena}</span>
                            <span class="edit-icon">✏️</span>
                        </span>
                        <div class="btn-group">
                            <button class="btn btn-outline btn-sm" onclick="duplicarQuincena('${mes}',${quincena},'gastos')">📋 Duplicar</button>
                            <button class="btn btn-outline btn-sm" onclick="agregarGastoModal('${mes}',${quincena})">➕ Agregar</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminarQuincena('${mes}',${quincena},'gastos')">🗑 Eliminar</button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Monto</th><th>Método</th><th>Obs</th><th></th></tr></thead>
                            <tbody>
                                ${items.map(i => `
                                    <tr class="${i.tipo==='Ingreso'?'row-ingreso':'row-gasto'}">
                                        <td>${fmtDate(i.fecha)}</td><td>${i.tipo}</td><td>${i.categoria}</td>
                                        <td>${fmt(i.monto)}</td><td>${i.metodo||''}</td><td>${i.obs||''}</td>
                                        <td>
                                            <button class="btn btn-xs btn-outline" onclick="editarGastoModal(${i.id},'gastos')">✏️</button>
                                            <button class="btn btn-xs btn-danger" onclick="eliminarItem(${i.id},'gastos')">🗑</button>
                                        </td>
                                    </tr>`).join('')}
                                <tr class="row-total"><td colspan="3"><strong>Totales</strong></td><td>Ing: ${fmt(ingresos)}</td><td>Gas: ${fmt(gastosT)}</td><td colspan="2"></td></tr>
                                <tr class="${sobra>=0?'row-sobra':'row-deficit'}"><td colspan="3"><strong>${sobra>=0?'Sobra':'Falta'}</strong></td><td colspan="4">${fmt(Math.abs(sobra))}</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }

            container.innerHTML = html;
        }

        async function duplicarQuincena(mes, quincena, store) {
            const nuevoMes = prompt('Nombre del nuevo mes para duplicar:');
            if (!nuevoMes) return;
            const items = await dbGetAll(store);
            const campoMes = store === 'tarjeta_gastos' ? 'corte' : 'mes';
            const aDuplicar = items.filter(i => i[campoMes] === mes && i.quincena === quincena);
            
            for (const item of aDuplicar) {
                const nuevo = { ...item };
                delete nuevo.id;
                nuevo[campoMes] = nuevoMes;
                await dbAdd(store, nuevo);
            }
            
            // Si es tarjeta, duplicar también las deudas
            if (store === 'tarjeta_gastos') {
                const deudas = await dbGetAll('tarjeta_deudas');
                for (const d of deudas.filter(x => x.corte === mes)) {
                    const nuevo = { ...d };
                    delete nuevo.id;
                    nuevo.corte = nuevoMes;
                    await dbAdd('tarjeta_deudas', nuevo);
                }
            }
            
            await renderAll();
            alert(`✅ Duplicado exitosamente a "${nuevoMes}"`);
        }

        async function eliminarQuincena(mes, quincena, store) {
            if (confirm(`¿Eliminar TODA la Quincena ${quincena} de "${mes}"?\n\nEsta acción no se puede deshacer.`)) {
                const items = await dbGetAll(store);
                const campoMes = store === 'tarjeta_gastos' ? 'corte' : 'mes';
                for (const item of items) {
                    if (item[campoMes] === mes && item.quincena === quincena) {
                        await dbDelete(store, item.id);
                    }
                }
                await renderAll();
            }
        }

                        <div class="summary-item"><h4>Deudas a favor</h4><div class="val neutral">${fmt(totalDeudasAFavor)}</div></div>
                        <div class="summary-item"><h4>Deudas Pagadas</h4><div class="val neutral">${fmt(deudasPago)}</div></div>
                        <div class="summary-item"><h4>Saldo Final</h4><div class="val positive">${fmt(saldoFinal)}</div></div>
                        <div class="summary-item"><h4>Hace Falta</h4><div class="val ${haceFalta <= 0 ? 'positive' : 'negative'}">${fmt(haceFalta)}</div></div>
                    </div>
                </div>`;
            }

            container.innerHTML = html;
        }

        async function editarCorteTarjeta(corte) {
            const nuevoNombre = prompt('Editar nombre del corte:', corte);
            if (!nuevoNombre || nuevoNombre === corte) return;
            
            const gastos = await dbGetAll('tarjeta_gastos');
            const deudas = await dbGetAll('tarjeta_deudas');
            
            for (const g of gastos) {
                if (g.corte === corte) { g.corte = nuevoNombre; await dbPut('tarjeta_gastos', g); }
            }
            for (const d of deudas) {
                if (d.corte === corte) { d.corte = nuevoNombre; await dbPut('tarjeta_deudas', d); }
            }
            
            await renderTarjeta();
        }

        function agregarTarjetaCorteModal() {
            const nombre = prompt('Nombre del nuevo corte (ej: Febrero 2026):');
            if (!nombre) return;
            agregarGastoTarjetaModal(nombre);
        }

        function agregarGastoTarjetaModal(corte) {
            currentModalType = 'tarjeta_gasto';
            editId = null;
            openModal(`
                <h3>➕ Agregar Movimiento - ${corte}</h3>
                <form onsubmit="guardarGastoTarjeta(event,'${corte}')">
                    <div class="form-group"><label>Tipo *</label><select id="tg-tipo" required><option value="Gasto">💸 Gasto</option><option value="Ahorro">🏦 Ahorro</option></select></div>
                    <div class="form-group"><label>Concepto *</label><input type="text" id="tg-concepto" required placeholder="Ej: Total Gastado"></div>
                    <div class="form-group"><label>Monto *</label><input type="number" id="tg-monto" required min="0" step="0.01" placeholder="0.00"></div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">✅ Guardar</button>
                    <button type="button" class="btn btn-outline" style="width:100%;margin-top:6px;" onclick="closeModal()">❌ Cancelar</button>
                </form>`);
        }

        async function guardarGastoTarjeta(e, corte) {
            e.preventDefault();
            const data = {
                corte,
                tipo: document.getElementById('tg-tipo').value,
                concepto: document.getElementById('tg-concepto').value,
                monto: parseFloat(document.getElementById('tg-monto').value)
            };
            if (editId) { data.id = editId; await dbPut('tarjeta_gastos', data); }
            else await dbAdd('tarjeta_gastos', data);
            closeModal();
            await renderTarjeta();
        }

        function agregarDeudaTarjetaModal(corte) {
            currentModalType = 'tarjeta_deuda';
            editId = null;
            openModal(`
                <h3>➕ Agregar Deuda - ${corte}</h3>
                <form onsubmit="guardarDeudaTarjeta(event,'${corte}')">
                    <div class="form-group"><label>Persona *</label><input type="text" id="td-persona" required placeholder="Ej: Daniela 4/5"></div>
                    <div class="form-group"><label>Monto *</label><input type="number" id="td-monto" required min="0" step="0.01" placeholder="0.00"></div>
                    <div class="form-group"><label>Estado *</label><select id="td-estado" required><option value="Debe">🔴 Debe</option><option value="Pago">🟢 Pago</option></select></div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">✅ Guardar</button>
                    <button type="button" class="btn btn-outline" style="width:100%;margin-top:6px;" onclick="closeModal()">❌ Cancelar</button>
                </form>`);
        }

        async function guardarDeudaTarjeta(e, corte) {
            e.preventDefault();
            const data = {
                corte,
                persona: document.getElementById('td-persona').value,
                monto: parseFloat(document.getElementById('td-monto').value),
                estado: document.getElementById('td-estado').value
            };
            if (editId) { data.id = editId; await dbPut('tarjeta_deudas', data); }
            else await dbAdd('tarjeta_deudas', data);
            closeModal();
            await renderTarjeta();
        }

        async function toggleDeudaTarjeta(id) {
            const deudas = await dbGetAll('tarjeta_deudas');
            const d = deudas.find(x => x.id === id);
            if (!d) return;
            d.estado = d.estado === 'Pago' ? 'Debe' : 'Pago';
            await dbPut('tarjeta_deudas', d);
            await renderTarjeta();
        }

        async function eliminarCorteTarjeta(corte) {
            if (confirm(`¿Eliminar COMPLETO el corte "${corte}"?\n\nSe eliminarán todos los gastos y deudas asociados.`)) {
                const gastos = await dbGetAll('tarjeta_gastos');
                const deudas = await dbGetAll('tarjeta_deudas');
                for (const g of gastos.filter(x => x.corte === corte)) await dbDelete('tarjeta_gastos', g.id);
                for (const d of deudas.filter(x => x.corte === corte)) await dbDelete('tarjeta_deudas', d.id);
                await renderTarjeta();
            }
        }

        // ==================== DEUDAS GENERALES ====================
        async function renderDeudasGenerales() {
            const container = document.getElementById('deudas-container');
            const deudas = await dbGetAll('deudas');
            const totalDebe = deudas.filter(d => d.estado === 'Debe' || d.estado === 'pendiente').reduce((s,d) => s + d.monto, 0);
            const totalPago = deudas.filter(d => d.estado === 'Pago' || d.estado === 'pago').reduce((s,d) => s + d.monto, 0);

            let html = `
            <div class="card">
                <div class="card-header">
                    <span class="card-title">👥 Deudas Generales</span>
                    <button class="btn btn-outline btn-sm" onclick="agregarDeudaModal('deudas')">➕ Agregar</button>
                </div>
                <div class="summary-grid" style="margin-bottom:12px;">
                    <div class="summary-item"><h4>🔴 Pendientes</h4><div class="val neutral">${fmt(totalDebe)}</div></div>
                    <div class="summary-item"><h4>🟢 Pagadas</h4><div class="val neutral">${fmt(totalPago)}</div></div>
                </div>`;

            for (const d of deudas.sort((a,b) => b.id - a.id)) {
                html += `
                <div class="deuda-item ${d.estado === 'Pago' || d.estado === 'pago' ? 'pagado' : 'debe'}">
                    <div class="deuda-info">
                        <div class="deuda-nombre">${d.persona}</div>
                        <div class="deuda-monto">${fmt(d.monto)}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span class="badge ${d.estado==='Pago'||d.estado==='pago'?'badge-success':'badge-danger'}">${d.estado}</span>
                        <button class="btn btn-xs btn-outline" onclick="toggleDeudaGeneral(${d.id})">🔄</button>
                        <button class="btn btn-xs btn-danger" onclick="eliminarItem(${d.id},'deudas')">🗑</button>
                    </div>
                </div>`;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function agregarDeudaModal(store) {
            currentModalType = 'deuda';
            editId = null;
            openModal(`
                <h3>➕ Agregar Deuda</h3>
                <form onsubmit="guardarDeudaGeneral(event,'${store}')">
                    <div class="form-group"><label>Persona *</label><input type="text" id="dg-persona" required placeholder="Nombre de la persona"></div>
                    <div class="form-group"><label>Monto *</label><input type="number" id="dg-monto" required min="0" step="0.01" placeholder="0.00"></div>
                    <div class="form-group"><label>Estado *</label><select id="dg-estado" required><option value="Debe">🔴 Debe</option><option value="Pago">🟢 Pago</option></select></div>
                    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">✅ Guardar</button>
                    <button type="button" class="btn btn-outline" style="width:100%;margin-top:6px;" onclick="closeModal()">❌ Cancelar</button>
                </form>`);
        }

        async function guardarDeudaGeneral(e, store) {
            e.preventDefault();
            const data = {
                persona: document.getElementById('dg-persona').value,
                monto: parseFloat(document.getElementById('dg-monto').value),
                estado: document.getElementById('dg-estado').value
            };
            if (editId) { data.id = editId; await dbPut(store, data); }
            else await dbAdd(store, data);
            closeModal();
            await renderAll();
        }

        async function toggleDeudaGeneral(id) {
            const deudas = await dbGetAll('deudas');
            const d = deudas.find(x => x.id === id);
            if (!d) return;
            d.estado = d.estado === 'Pago' ? 'Debe' : 'Pago';
            await dbPut('deudas', d);
            await renderDeudasGenerales();
        }

        // ==================== START ====================
        init();
        console.log('✅ Finanzas App lista - Colores azules, orden descendente, editable');
    </script>
</body>
</html>
